name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version requires-python and the classifiers promise.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Run fixture tests
        run: pytest

  public-copy:
    # OVERVIEW.md, CHANGELOG.md, metadata and DATA_TERMS.md files are what
    # readers see on PyPI and GitHub; keep them free of typographic dashes,
    # curly quotes and internal names. The tests hold the control cases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public copy
        run: python scripts/check_public_copy.py
