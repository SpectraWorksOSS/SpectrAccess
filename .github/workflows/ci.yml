name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  OPENBLAS_NUM_THREADS: "1"

jobs:
  iasi-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install IASI reader and fixture test dependencies
        run: python -m pip install -e ".[iasi]" pytest
      - name: Initialize Julia and the maintained native reader
        run: python -c "from metoppy import MetopReader; MetopReader()"
      - name: Run IASI entrance tests without live provider access
        env:
          PYTHON_JULIAPKG_OFFLINE: "yes"
          JULIA_PKG_OFFLINE: "true"
        run: python -m pytest tests/test_iasi_eumetsat.py -q

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Every version requires-python and the classifiers promise.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[${{ matrix.python-version == '3.12' && 'test,slstr,viirs,fci,seviri' || 'test' }}]"
      - name: Fetch pinned ESA reference document
        run: python tests/fixtures/imagery/fetch_esa_srf.py
      - name: Run fixture tests
        run: pytest

  public-copy:
    # README.md, CHANGELOG.md, metadata and DATA_TERMS.md files are what
    # readers see on PyPI and GitHub; keep them free of typographic dashes,
    # curly quotes and internal names. The tests hold the control cases.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check public copy
        run: python scripts/check_public_copy.py
