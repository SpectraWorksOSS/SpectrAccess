[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spectraccess"
version = "0.6.1"
description = "Python library to find and download Earth observation satellite imagery and cal/val reference data through one interface: Sentinel-2, Sentinel-3 SLSTR, Landsat 8 and 9, VIIRS, MTG FCI, MSG SEVIRI and NASA EMIT products, plus RadCalNet, GSICS, AERONET, CAMS, OLCI water vapour and GNSS data. Returns each provider's data as published, with no correction or calibration applied."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
keywords = [
  "earth observation", "remote sensing", "satellite data", "satellite imagery",
  "satellite data download", "calibration and validation", "cal/val",
  "radiometric calibration", "vicarious calibration", "satellite calibration",
  "Sentinel-2", "Sentinel-3", "SLSTR", "OLCI", "Landsat", "VIIRS", "MTG", "FCI",
  "SEVIRI", "Meteosat", "EMIT", "hyperspectral", "Copernicus Data Space Ecosystem",
  "NASA Earthdata", "EUMETSAT", "RadCalNet", "GSICS", "AERONET", "CAMS", "GNSS",
  "surface reflectance", "top-of-atmosphere reflectance", "aerosol optical depth",
  "water vapour", "measurement uncertainty", "pandas", "xarray",
]
authors = [
  { name = "SpectraWorks B.V." }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "keyring>=25",
  "requests>=2.31",
  "pandas>=2.0",
  "xarray>=2023.1",
  # netCDF-3-classic backend for xarray: GSICS operational GPPA products are
  # CDF classic (not HDF5-based netCDF4), and scipy is the lightest maintained
  # engine that reads that format without pulling in the netCDF4 C library.
  "scipy>=1.10",
]

[project.scripts]
spectraccess = "spectraccess.cli:main"

[project.urls]
Homepage = "https://github.com/SpectraWorksOSS/SpectrAccess"
Repository = "https://github.com/SpectraWorksOSS/SpectrAccess"
Documentation = "https://github.com/SpectraWorksOSS/SpectrAccess/tree/main/docs"
Issues = "https://github.com/SpectraWorksOSS/SpectrAccess/issues"
Changelog = "https://github.com/SpectraWorksOSS/SpectrAccess/blob/main/CHANGELOG.md"
"SpectraWorks RefCal" = "https://spectraworks.nl/refcal"
"EO-Atlas" = "https://eo-atlas.org/"

[project.optional-dependencies]
seviri = [
  "satpy==0.60.0",
  "eumdac>=3.1,<4",
]
viirs = [
  "satpy==0.60.0",
  "earthaccess==0.18.0",
  "netCDF4>=1.6",
  "h5netcdf>=1.3",
  "h5py>=3.10",
]
fci = [
  "hdf5plugin>=6.0",
  "satpy==0.60.0",
  "netCDF4>=1.6",
  "h5netcdf>=1.3",
  "h5py>=3.10",
  "eumdac>=3.1,<4",
]

slstr = [
  "satpy==0.60.0",
  "netCDF4>=1.6",
  "cdsetool>=0.3.1,<0.4",
  "h5netcdf>=1.3",
  "h5py>=3.10",
]
cdse = [
  "cdsetool>=0.3.1,<0.4",
  # OLCI IWV and annotations use HDF5 NetCDF4.
  "h5netcdf>=1.3",
  "h5py>=3.10",
]
cams = [
  # ECMWF's maintained client for CDS/ADS retrieval. The connector keeps the
  # provider transport here instead of freezing the ADS REST lifecycle.
  "cdsapi>=0.7.7,<0.8",
  # ADS returns HDF5-based netCDF4, while core xarray support only guarantees
  # the lightweight scipy netCDF3 backend used by GSICS products.
  "h5netcdf>=1.3",
  "h5py>=3.10",
]
emit = [
  # Intentionally unmarked: earthaccess 0.18 requires Python >=3.12. Keeping
  # the dependency active makes pip reject spectraccess[emit] on 3.10/3.11
  # instead of silently installing an unusable extra without its client.
  "earthaccess==0.18.0",
  "h5netcdf>=1.3",
  "h5py>=3.10",
]
landsat = [
  "eodag[usgs]>=4.3,<5",
]
test = [
  "pytest>=8",
  "requests-mock>=1.11",
  # Exercise the real maintained-client adapter in fixture tests. Runtime
  # users who need this connector install spectraccess[cdse].
  "cdsetool>=0.3.1,<0.4",
  "cdsapi>=0.7.7,<0.8",
  "h5netcdf>=1.3",
  "h5py>=3.10",
  # Marked here (unlike the emit extra) so contributors on 3.10/3.11 can
  # install the test extra; the EMIT tests skip there.
  "earthaccess==0.18.0; python_version >= '3.12'",
  "eodag[usgs]>=4.3,<5",
]

[tool.hatch.build.targets.sdist]
# Everything tracked ships by default; only local working trees and caches
# are dropped, so new top-level content needs no packaging change.
exclude = [
  "/.worktrees",
  "/.worktree-info",
  "/.venv",
  "/dist",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

